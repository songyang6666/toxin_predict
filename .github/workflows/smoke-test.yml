name: smoke-test

on:
  push:
  pull_request:

jobs:
  toxin-predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest -q
      - name: Run toxin predict smoke test
        run: |
          toxin-predict --verbose 0 --output-dir data/outputs/ci_smoke_test
          test -f data/outputs/ci_smoke_test/metrics.json
          test -f data/outputs/ci_smoke_test/predictions.csv
          test -f data/outputs/ci_smoke_test/cv_results.csv
