[project]
name = "ml-toxin-predict"
version = "0.1.0"
description = "Reproducible one-week total microcystin prediction workflow."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "shap>=0.45,<1",
  "joblib>=1.4,<2",
  "xgboost>=2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
toxin-predict = "ml_toxin_predict.cli:main"
toxin-predict-horizons = "ml_toxin_predict.horizons:main"
toxin-predict-weekly = "ml_toxin_predict.weekly_validation:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
